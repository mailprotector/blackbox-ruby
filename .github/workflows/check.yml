name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ruby-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['2.7', '3.1', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: gem install minitest -v '5.25.5' --no-document
      - run: ruby -Ilib test/client_test.rb
      - run: gem build mailprotector-blackbox.gemspec
  rails-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rails: ['8.0.2', '8.1.4']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: gem install railties:${{ matrix.rails }} activejob:${{ matrix.rails }} sidekiq:7.3.9 minitest:5.25.5 --no-document
      - run: ruby -Ilib test/framework_test.rb
